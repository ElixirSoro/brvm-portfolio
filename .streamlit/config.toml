[theme]
base = "dark"
primaryColor = "#F0B429"
backgroundColor = "#0D141F"
secondaryBackgroundColor = "#18263A"
textColor = "#E8EDF3"
borderColor = "#243447"
font = "Instrument Sans, sans-serif"
headingFont = "Bricolage Grotesque, sans-serif"
codeFont = "JetBrains Mono, monospace"

[server]
headless = true
runOnSave = false
# Pas de rechargement à chaud : Streamlit ne recharge que les modules modifiés, alors que le paquet brvm garde
# des références aux anciennes versions (« from . import auth » renvoie l'ancien module). Après une mise à jour
# du code : Reboot de l'app en ligne, ou relance de l'application en local.
fileWatcherType = "none"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

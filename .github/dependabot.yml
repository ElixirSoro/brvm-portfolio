# Mises à jour proposées chaque mois en pull request ; la CI (Tests) les vérifie avant fusion.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    groups:
      dependances:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

# Sauvegarde hebdomadaire de la base Supabase, chiffrée : le dépôt est public, ses artefacts aussi.
# Contenu : schéma public (tables + données) et comptes (auth.users, données seules).
# Pré-requis : secrets DATABASE_URL et BACKUP_PASSPHRASE. Restauration : voir README, section « Sauvegardes ».
name: Sauvegarde
on:
  schedule:
    - cron: "13 2 * * 1"   # lundi 2 h 13 GMT
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Secrets présents
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          test -n "$DATABASE_URL" || { echo "::error::secret DATABASE_URL manquant"; exit 1; }
          test -n "$BACKUP_PASSPHRASE" || { echo "::error::secret BACKUP_PASSPHRASE manquant"; exit 1; }
      - name: Client PostgreSQL 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17
      - name: Export chiffré
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          # pg_dump exige une session complète : port 5432 du pooler (mode session), pas 6543 (mode transaction)
          URL="${DATABASE_URL/:6543\//:5432/}"
          STAMP=$(date -u +%Y-%m-%d)
          mkdir -p out
          {
            /usr/lib/postgresql/17/bin/pg_dump "$URL" --no-owner --no-privileges --schema=public
            /usr/lib/postgresql/17/bin/pg_dump "$URL" --no-owner --no-privileges --data-only --table=auth.users
          } | gzip -9 | gpg --batch --yes --symmetric --cipher-algo AES256 --pinentry-mode loopback \
                --passphrase-fd 3 3<<< "$BACKUP_PASSPHRASE" -o "out/brvm-$STAMP.sql.gz.gpg"
          ls -l out
          test "$(stat -c %s "out/brvm-$STAMP.sql.gz.gpg")" -gt 10000 || { echo "::error::sauvegarde trop petite"; exit 1; }
      - uses: actions/upload-artifact@v5
        with:
          name: sauvegarde-brvm
          path: out/*.gpg
          retention-days: 90
          if-no-files-found: error

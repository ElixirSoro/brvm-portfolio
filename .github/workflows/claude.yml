# Claude répond quand on écrit @claude dans une issue ou une pull request de ce dépôt.
# Pré-requis : app GitHub « Claude » installée sur le dépôt (https://github.com/apps/claude)
# et secret CLAUDE_CODE_OAUTH_TOKEN (abonnement Claude, `claude setup-token`) dans
# Settings › Secrets and variables › Actions.
name: Claude
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]
jobs:
  claude:
    # Dépôt public : seuls le propriétaire et les collaborateurs déclenchent Claude (jeton et droits d'écriture).
    if: >-
      (contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--max-turns 30"

# Contrôles à chaque modification : style, typage, règles NASA et tests (SQLite puis PostgreSQL).
name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: brvmtest
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Dépendances
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Style (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Typage (mypy)
        run: mypy
      - name: Tests sur SQLite
        run: pytest -q
      - name: Tests sur PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/brvmtest
        run: pytest -q
